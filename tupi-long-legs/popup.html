<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 340px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; background: #0e0e10; color: #efeff1; }
    h1 { font-size: 15px; margin: 0 0 10px; color: #53fc18; }
    label { display: block; margin: 10px 0 4px; color: #adadb8; }
    textarea, input, select { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; border: 1px solid #333; background: #1a1a1d; color: inherit; font: inherit; }
    textarea { height: 90px; resize: vertical; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    button { margin-top: 12px; width: 100%; padding: 8px; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
    #toggle { background: #53fc18; color: #000; }
    #toggle.running { background: #e5484d; color: #fff; }
    #previewBtn { background: #26262c; color: #efeff1; margin-top: 8px; }
    #preview, #status { margin-top: 10px; padding: 8px; border-radius: 6px; background: #1a1a1d; color: #adadb8; min-height: 16px; white-space: pre-wrap; word-break: break-word; }
    #status.err { color: #ff8a8a; }
    small { color: #7c7c85; display: block; margin-top: 4px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Kick Timed Chat</h1>

  <label for="messages">Messages (one per line)</label>
  <textarea id="messages" placeholder="Welcome to {channel}'s stream! It's {time}"></textarea>
  <small>Variables: {channel} {time} {date} {n} {rand:a|b|c}</small>

  <div class="row">
    <div>
      <label for="interval">Every (seconds, min 15)</label>
      <input id="interval" type="number" min="15" value="60" />
    </div>
    <div>
      <label for="max">Max messages (0 = ∞)</label>
      <input id="max" type="number" min="0" value="0" />
    </div>
  </div>

  <label for="order">Order</label>
  <select id="order">
    <option value="sequential">In order</option>
    <option value="random">Random</option>
  </select>

  <button id="previewBtn">Preview</button>
  <div id="preview"></div>

  <button id="toggle">Start</button>
  <div id="status">Idle</div>

  <script src="template.js"></script>
  <script src="popup.js"></script>
</body>
</html>
